name: Build RE-CP-03 ImmortalWrt 25.12

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build.yml'
      - 'scripts/**'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: re-cp-03-immortalwrt-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout builder files
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget \
            xsltproc qemu-utils device-tree-compiler ccache curl \
            libelf-dev ecj fastjar java-propose-classpath

      - name: Clone ImmortalWrt 25.12
        run: |
          git clone --depth 1 --branch openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          git rev-parse HEAD | tee ../immortalwrt-commit.txt

      - name: Add package feeds
        working-directory: openwrt
        run: |
          set -euxo pipefail
          cat >> feeds.conf.default <<'FEEDS'
          src-git nikki https://github.com/nikkinikki-org/OpenWrt-nikki.git;main
          src-git istore https://github.com/linkease/istore.git;main
          src-git argon https://github.com/jerrykuku/luci-theme-argon.git;master
          FEEDS
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add DDNSTO packages
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/linkease/nas-packages.git nas-packages
          mkdir -p openwrt/package/local-ddnsto
          # Locate DDNSTO core and LuCI package directories without assuming one fixed tree layout.
          find nas-packages -type f -name Makefile -print0 | while IFS= read -r -d '' mf; do
            dir="$(dirname "$mf")"
            name="$(sed -n 's/^[[:space:]]*PKG_NAME[[:space:]]*:=\s*//p' "$mf" | head -n1)"
            case "$name" in
              ddnsto|luci-app-ddnsto|luci-i18n-ddnsto-zh-cn)
                dest="openwrt/package/local-ddnsto/$name"
                mkdir -p "$dest"
                cp -a "$dir"/. "$dest"/
                echo "Found DDNSTO package: $name at $dir"
                ;;
            esac
          done
          test -f openwrt/package/local-ddnsto/ddnsto/Makefile
          test -f openwrt/package/local-ddnsto/luci-app-ddnsto/Makefile

      - name: Configure RE-CP-03 and packages
        working-directory: openwrt
        run: |
          set -euxo pipefail
          cat > .config <<'CONFIG'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_jdcloud_re-cp-03=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_PACKAGE_nikki=y
          CONFIG_PACKAGE_luci-app-nikki=y
          CONFIG_PACKAGE_luci-i18n-nikki-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_ddnsto=y
          CONFIG_PACKAGE_luci-app-ddnsto=y
          CONFIG_PACKAGE_luci-i18n-ddnsto-zh-cn=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_luci-app-ttyd=n
          CONFIG_PACKAGE_luci-app-upnp=n
          CONFIG_VERSIONOPT=y
          CONFIG_VERSION_DIST="ImmortalWrt"
          CONFIG_VERSION_NUMBER="25.12-custom-re-cp-03"
          CONFIG_VERSION_REPO="https://downloads.immortalwrt.org/releases/25.12/"
          CONFIG
          make defconfig
          ./scripts/diffconfig.sh > ../diffconfig.txt
          grep -E 'CONFIG_TARGET_mediatek_filogic_DEVICE_jdcloud_re-cp-03=y|CONFIG_PACKAGE_(luci-theme-argon|luci-app-store|nikki|luci-app-nikki|ddnsto|luci-app-ddnsto)=y' .config

      - name: Build firmware
        working-directory: openwrt
        run: |
          set -o pipefail
          make -j"$(nproc)" download
          make -j"$(nproc)" V=s 2>&1 | tee ../build.log

      - name: Verify output
        run: |
          set -euxo pipefail
          find openwrt/bin/targets/mediatek/filogic -maxdepth 1 -type f -name '*jdcloud_re-cp-03*' -print | tee image-list.txt
          grep -q '\.itb$' image-list.txt
          grep -q 'jdcloud_re-cp-03' image-list.txt

      - name: Upload firmware and build metadata
        uses: actions/upload-artifact@v4
        with:
          name: re-cp-03-immortalwrt-itb
          if-no-files-found: error
          retention-days: 14
          path: |
            openwrt/bin/targets/mediatek/filogic/*jdcloud_re-cp-03*.itb
            openwrt/bin/targets/mediatek/filogic/sha256sums
            immortalwrt-commit.txt
            diffconfig.txt
            image-list.txt
            build.log
