```yaml
name: Build RE-CP-03 ImmortalWrt 25.12

'on':
  workflow_dispatch:
  push:
    branches:
      - '主要'
    paths:
      - '.github/workflows/build.yml'
      - 'scripts/**'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: re-cp-03-immortalwrt-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout builder files
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev libelf-dev liblzma-dev \
            python3 python3-setuptools python3-pip \
            rsync swig unzip zlib1g-dev file wget curl \
            xsltproc qemu-utils device-tree-compiler ccache

      - name: Clone ImmortalWrt 25.12
        run: |
          set -euxo pipefail
          git clone --depth 1 \
            --branch openwrt-25.12 \
            https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          git rev-parse HEAD | tee ../immortalwrt-commit.txt

      - name: Add package feeds
        working-directory: openwrt
        run: |
          set -euxo pipefail

          cat >> feeds.conf.default <<'FEEDS'
          src-git nikki https://github.com/nikkinikki-org/OpenWrt-nikki.git;main
          src-git istore https://github.com/linkease/istore.git;main
          src-git argon https://github.com/jerrykuku/luci-theme-argon.git;master
          src-git nas https://github.com/linkease/nas-packages.git;master
          src-git nas_luci https://github.com/linkease/nas-packages-luci.git;main
          FEEDS

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          ./scripts/feeds install -p nas ddnsto
          ./scripts/feeds install -p nas_luci luci-app-ddnsto

          test -f package/feeds/nas/ddnsto/Makefile
          test -f package/feeds/nas_luci/luci-app-ddnsto/Makefile

      - name: Configure RE-CP-03 and packages
        working-directory: openwrt
        run: |
          set -euxo pipefail

          cat > .config <<'CONFIG'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_jdcloud_re-cp-03=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-compat=y

          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-store=y

          CONFIG_PACKAGE_nikki=y
          CONFIG_PACKAGE_luci-app-nikki=y
          CONFIG_PACKAGE_luci-i18n-nikki-zh-cn=y

          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y

          CONFIG_PACKAGE_ddnsto=y
          CONFIG_PACKAGE_luci-app-ddnsto=y

          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_block-mount=y

          CONFIG_PACKAGE_luci-app-ttyd=n
          CONFIG_PACKAGE_luci-app-upnp=n

          CONFIG_VERSIONOPT=y
          CONFIG_VERSION_DIST="ImmortalWrt"
          CONFIG_VERSION_NUMBER="25.12-custom-re-cp-03"
          CONFIG_VERSION_REPO="https://downloads.immortalwrt.org/releases/25.12/"
          CONFIG

          make defconfig
          ./scripts/diffconfig.sh > ../diffconfig.txt

          grep -E \
            '^CONFIG_TARGET_mediatek_filogic_DEVICE_jdcloud_re-cp-03=y$' \
            .config

          grep -E \
            '^CONFIG_PACKAGE_(luci-theme-argon|luci-app-store|nikki|luci-app-nikki|ddnsto|luci-app-ddnsto)=y$' \
            .config

      - name: Download build sources
        working-directory: openwrt
        run: |
          set -euxo pipefail
          make -j"$(nproc)" download

      - name: Build firmware
        working-directory: openwrt
        run: |
          set -euxo pipefail
          make -j"$(nproc)" V=s 2>&1 | tee ../build.log

      - name: Verify output
        run: |
          set -euxo pipefail

          TARGET_DIR="openwrt/bin/targets/mediatek/filogic"
          test -d "$TARGET_DIR"

          find "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*jdcloud_re-cp-03*' \
            -print | tee image-list.txt

          grep -q '\.itb$' image-list.txt
          grep -q 'jdcloud_re-cp-03' image-list.txt
          test -s "$TARGET_DIR/sha256sums"

      - name: Upload firmware and build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: re-cp-03-immortalwrt-itb
          if-no-files-found: warn
          retention-days: 14
          path: |
            openwrt/bin/targets/mediatek/filogic/*jdcloud_re-cp-03*.itb
            openwrt/bin/targets/mediatek/filogic/sha256sums
            immortalwrt-commit.txt
            diffconfig.txt
            image-list.txt
            build.log
```
